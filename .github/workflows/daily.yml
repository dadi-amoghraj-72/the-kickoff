# The Kickoff daily run.
# OFF until every checkpoint has passed its test run (D's rule): this workflow can only be started by hand (Actions tab > Run workflow).
# To go live, D adds a `schedule:` block here: cron "15 23 * * *" is 7:15am Singapore time. Nothing else needs to change (a scheduled run
# uses Claude and sends the ping on its own; a manual run does so only when its boxes are set to true).
name: Daily edition

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, Singapore); empty means today"
        required: false
      claude:
        description: "Use Claude for notes and overviews (true or false)"
        required: false
        default: "false"
      ping:
        description: "Send the Telegram ping (true or false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kickoff-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CRICKET_DATA_API_KEY: ${{ secrets.CRICKET_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the edition
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.claude }}" = "true" ]; then ARGS="$ARGS --claude"; fi
          python scripts/daily.py $ARGS
      - name: Publish (commit the edition, the state and the site)
        run: |
          git config user.name "the-kickoff-bot"
          git config user.email "the-kickoff-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Nothing new to publish"; else git commit -m "Edition $(date -u +%F)" && git push; fi
      - name: Telegram ping
        if: ${{ github.event_name == 'schedule' || github.event.inputs.ping == 'true' }}
        run: |
          sleep 60   # GitHub Pages needs a minute to publish the new page before the link works
          python scripts/send_ping.py
      - name: Alert D if the run failed
        if: failure()
        run: python scripts/alert.py
