# The Kickoff daily run.
# LIVE since 8 November 2026 (D's go after the three test mornings): every day at 7:15am Singapore time (cron "15 23 * * *" is 23:15 UTC the day before).
# A scheduled run uses Claude and sends the ping on its own; a manual run (Actions tab > Run workflow) does so only when its boxes are set to true.
name: Daily edition

on:
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, Singapore); empty means today"
        required: false
      claude:
        description: "Use Claude for notes and overviews (true or false)"
        required: false
        default: "false"
      force:
        description: "Rebuild a date that already has an edition (true or false)"
        required: false
        default: "false"
      ping:
        description: "Send the Telegram ping (true or false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: kickoff-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CRICKET_DATA_API_KEY: ${{ secrets.CRICKET_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the edition
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.claude }}" = "true" ]; then ARGS="$ARGS --claude"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/daily.py $ARGS
      - name: Publish (commit the edition, the state and the site)
        run: |
          git config user.name "the-kickoff-bot"
          git config user.email "the-kickoff-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "Nothing new to publish"; else git commit -m "Edition $(TZ=Asia/Singapore date +%F)" && git push; fi
      - name: Telegram ping
        # always(): even if the publish step failed (GitHub rejecting pushes), the edition built on this runner is still sent. The ping waits up to 15 minutes for the page to be
        # live; if it is not, it sends the digest as text and the whole page as an HTML file instead (kickoff/backup.py). It sends only today's edition, never an old one.
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.ping == 'true') }}
        run: python scripts/send_ping.py --wait 900 ${{ github.event.inputs.date }}
      - name: Alert D if the run failed
        if: failure()
        run: python scripts/alert.py
